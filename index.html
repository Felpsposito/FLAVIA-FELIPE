<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <title>Flávia & Felipe | 10.10.2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f5f1e8;--ink:#481a27;--muted:#74666a;--accent:#6d2638;--line:#d9d3c7}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Montserrat,Arial,sans-serif}
    .hero{min-height:58vh;position:relative;display:flex;align-items:flex-end;justify-content:center;padding:38px 22px;overflow:hidden}
    .hero:before{content:"";position:absolute;inset:0;background:url("foto-flavia-felipe.jpg") center 64%/cover no-repeat;filter:grayscale(100%) contrast(1.05);transform:scale(1.002)}
    .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.06),rgba(0,0,0,.10) 48%,rgba(0,0,0,.64))}
    .heroText{position:relative;z-index:1;text-align:center;color:white;text-shadow:0 2px 20px rgba(0,0,0,.25)}
    h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(46px,12vw,78px);line-height:.95;margin:0}
    .date{margin-top:12px;letter-spacing:.32em;font-size:12px;font-weight:500}
    main{max-width:620px;margin:auto;padding:38px 22px 52px;text-align:center}
    h2{font-family:"Cormorant Garamond",serif;font-size:36px;font-weight:600;margin:0 0 12px}
    p{font-size:14px;line-height:1.75;color:var(--muted);margin:0 auto 26px;max-width:480px}
    label{display:block;text-align:left;font-size:12px;font-weight:600;letter-spacing:.08em;margin:0 0 8px}
    input[type=text]{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;font:inherit;color:var(--ink);outline:none;margin-bottom:14px}
    .upload{display:block;width:100%;padding:17px 18px;border-radius:12px;background:var(--accent);color:white;font-weight:600;cursor:pointer}
    input[type=file]{display:none}
    .hint{font-size:11px;color:#818983;margin-top:11px}
    .selected{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:12px;display:none;text-align:left;font-size:13px}
    .send{width:100%;border:0;border-radius:12px;padding:16px;margin-top:12px;background:#b9b2a5;color:white;font:600 14px Montserrat;cursor:not-allowed}
    .send.ready{background:var(--ink);cursor:pointer}
    .status{margin-top:16px;font-size:13px;min-height:20px}
    footer{padding:0 20px 30px;text-align:center;color:#8b908d;font-family:"Cormorant Garamond",serif;font-size:17px}
  </style>
</head>
<body>
  <section class="hero">
    <div class="heroText"><h1>Flávia &amp; Felipe</h1><div class="date">10 · 10 · 2026</div></div>
  </section>
  <main>
    <h2>Registre esse momento com a gente ♡</h2>
    <p>Queremos guardar também o casamento pelos olhos de quem viveu esse dia conosco. Envie aqui as fotos que você tirar durante a celebração.</p>

    <label for="guest">SEU NOME <span style="font-weight:300">(OPCIONAL)</span></label>
    <input id="guest" type="text" maxlength="80" placeholder="Como podemos identificar suas fotos?">

    <label class="upload" for="photos">＋ &nbsp; Adicionar fotos</label>
    <input id="photos" type="file" accept="image/*" multiple>
    <div class="hint">Você pode selecionar várias fotos de uma vez.</div>

    <div id="selected" class="selected"></div>
    <button id="send" class="send" disabled>Enviar fotos</button>
    <div id="status" class="status"></div>
  </main>
  <footer>F &amp; F · 10.10.2026</footer>

<script>
const CLOUD_NAME = 'xdphuome';
const UPLOAD_PRESET = 'casamento_flavia_felipe';
const UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

const photos = document.getElementById('photos');
const selected = document.getElementById('selected');
const send = document.getElementById('send');
const status = document.getElementById('status');
const guest = document.getElementById('guest');

let queuedFiles = [];

function fileKey(file) {
  return `${file.name}|${file.size}|${file.lastModified}`;
}

function renderQueue() {
  const n = queuedFiles.length;
  if (n) {
    selected.style.display = 'block';
    selected.innerHTML =
      `<strong>${n === 1 ? '1 foto pronta para enviar' : `${n} fotos prontas para enviar`}</strong><br>` +
      `<span style="font-size:11px;color:#818983">Você pode tocar em “Adicionar fotos” novamente para incluir mais.</span>`;
    send.disabled = false;
    send.classList.add('ready');
    send.textContent = n === 1 ? 'Enviar 1 foto' : `Enviar ${n} fotos`;
  } else {
    selected.style.display = 'none';
    send.disabled = true;
    send.classList.remove('ready');
    send.textContent = 'Enviar fotos';
  }
}

photos.addEventListener('change', () => {
  const existing = new Set(queuedFiles.map(fileKey));
  const MAX_FILE_SIZE = 10 * 1024 * 1024;
  let oversized = 0;
  let invalid = 0;

  for (const file of Array.from(photos.files)) {
    if (!file.type.startsWith('image/')) {
      invalid++;
      continue;
    }
    if (file.size > MAX_FILE_SIZE) {
      oversized++;
      continue;
    }
    if (!existing.has(fileKey(file))) {
      queuedFiles.push(file);
      existing.add(fileKey(file));
    }
  }

  // Limpa o seletor nativo para que novas fotos sejam somadas à fila.
  photos.value = '';
  renderQueue();

  if (oversized) {
    status.innerHTML =
      `⚠ ${oversized === 1 ? 'Uma foto não foi adicionada' : `${oversized} fotos não foram adicionadas`} ` +
      `porque ${oversized === 1 ? 'ela ultrapassa' : 'elas ultrapassam'} 10 MB. ` +
      `Tente enviar ${oversized === 1 ? 'essa foto' : 'essas fotos'} em tamanho menor.`;
  } else if (invalid) {
    status.textContent = '⚠ Selecione apenas arquivos de imagem.';
  } else {
    status.textContent = '';
  }
});

function safeContextValue(value) {
  return value.replace(/[|=\n\r]/g, ' ').trim().slice(0, 200);
}

function uploadOne(file, guestName, index, total) {
  return new Promise((resolve, reject) => {
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', UPLOAD_PRESET);
    if (guestName) form.append('context', `convidado=${safeContextValue(guestName)}`);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', UPLOAD_URL);

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        status.textContent = `Enviando foto ${index + 1} de ${total} — ${pct}%`;
      }
    };

    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else {
        let msg = 'Falha no envio.';
        try { msg = JSON.parse(xhr.responseText)?.error?.message || msg; } catch {}
        reject(new Error(msg));
      }
    };
    xhr.onerror = () => reject(new Error('Falha de conexão durante o envio.'));
    xhr.send(form);
  });
}

send.addEventListener('click', async () => {
  if (!queuedFiles.length) return;

  const filesToSend = [...queuedFiles];
  send.disabled = true;
  send.classList.remove('ready');
  send.textContent = 'Enviando...';

  try {
    const guestName = guest.value.trim();
    for (let i = 0; i < filesToSend.length; i++) {
      await uploadOne(filesToSend[i], guestName, i, filesToSend.length);
    }
    queuedFiles = [];
    renderQueue();
    send.textContent = 'Fotos enviadas';
    status.innerHTML = `✓ ${filesToSend.length === 1 ? 'Foto recebida' : `${filesToSend.length} fotos recebidas`}! Obrigado por registrar esse momento com a gente ♡`;
  } catch (err) {
    status.textContent = `Não foi possível concluir o envio: ${err.message}`;
    send.disabled = false;
    send.classList.add('ready');
    send.textContent = filesToSend.length === 1 ? 'Tentar enviar 1 foto' : `Tentar enviar ${filesToSend.length} fotos`;
  }
});

renderQueue();
</script>
</body>
</html>
