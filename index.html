<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <title>Flávia & Felipe | 10.10.2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f5f1e8;--ink:#203028;--muted:#68736d;--accent:#385346;--line:#d9d3c7}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Montserrat,Arial,sans-serif}
    .hero{min-height:58vh;position:relative;background:url('foto-flavia-felipe.jpg') center 64%/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding:38px 22px}
    .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.06),rgba(0,0,0,.10) 48%,rgba(0,0,0,.64))}
    .heroText{position:relative;z-index:1;text-align:center;color:white;text-shadow:0 2px 20px rgba(0,0,0,.25)}
    h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(46px,12vw,78px);line-height:.95;margin:0}
    .date{margin-top:12px;letter-spacing:.32em;font-size:12px;font-weight:500}
    main{max-width:620px;margin:auto;padding:38px 22px 52px;text-align:center}
    h2{font-family:"Cormorant Garamond",serif;font-size:36px;font-weight:600;margin:0 0 12px}
    p{font-size:14px;line-height:1.75;color:var(--muted);margin:0 auto 26px;max-width:480px}
    label{display:block;text-align:left;font-size:12px;font-weight:600;letter-spacing:.08em;margin:0 0 8px}
    input[type=text]{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;font:inherit;color:var(--ink);outline:none;margin-bottom:14px}
    .upload{display:block;width:100%;padding:17px 18px;border-radius:12px;background:var(--accent);color:white;font-weight:600;cursor:pointer}
    input[type=file]{display:none}
    .hint{font-size:11px;color:#818983;margin-top:11px}
    .selected{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:12px;display:none;text-align:left;font-size:13px}
    .send{width:100%;border:0;border-radius:12px;padding:16px;margin-top:12px;background:#b9b2a5;color:white;font:600 14px Montserrat;cursor:not-allowed}
    .send.ready{background:var(--ink);cursor:pointer}
    .status{margin-top:16px;font-size:13px;min-height:20px}
    footer{padding:0 20px 30px;text-align:center;color:#8b908d;font-family:"Cormorant Garamond",serif;font-size:17px}
  </style>
</head>
<body>
  <section class="hero">
    <div class="heroText"><h1>Flávia &amp; Felipe</h1><div class="date">10 · 10 · 2026</div></div>
  </section>
  <main>
    <h2>Registre esse momento com a gente ♡</h2>
    <p>Queremos guardar também o casamento pelos olhos de quem viveu esse dia conosco. Envie aqui as fotos que você tirar durante a celebração.</p>

    <label for="guest">SEU NOME <span style="font-weight:300">(OPCIONAL)</span></label>
    <input id="guest" type="text" maxlength="80" placeholder="Como podemos identificar suas fotos?">

    <label class="upload" for="photos">＋ &nbsp; Escolher minhas fotos</label>
    <input id="photos" type="file" accept="image/*" multiple>
    <div class="hint">Você pode selecionar várias fotos de uma vez.</div>

    <div id="selected" class="selected"></div>
    <button id="send" class="send" disabled>Enviar fotos</button>
    <div id="status" class="status"></div>
  </main>
  <footer>F &amp; F · 10.10.2026</footer>

<script>
const photos = document.getElementById('photos');
const selected = document.getElementById('selected');
const send = document.getElementById('send');
const status = document.getElementById('status');

photos.addEventListener('change', () => {
  const n = photos.files.length;
  if(n){
    selected.style.display='block';
    selected.textContent = n === 1 ? '1 foto selecionada.' : `${n} fotos selecionadas.`;
    send.disabled=false; send.classList.add('ready');
    status.textContent='';
  } else {
    selected.style.display='none'; send.disabled=true; send.classList.remove('ready');
  }
});

send.addEventListener('click', () => {
  status.innerHTML = '✓ O visual do site está pronto. Agora vamos conectar o armazenamento privado para ativar o envio.';
});
</script>
</body>
</html>
